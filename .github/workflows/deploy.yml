name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathpdf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_ENV: ${{ secrets.APP_ENV }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to /opt/mathPDF
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/mathPDF'
          rsync -az --delete --exclude='.git' --exclude='.env*' --exclude='.formula-lab' ./ "$VPS_USER@$VPS_HOST:/opt/mathPDF/"
          printf '%s\n' "$APP_ENV" | ssh "$VPS_USER@$VPS_HOST" 'umask 077 && cat > /opt/mathPDF/.env && chmod 600 /opt/mathPDF/.env'
          ssh "$VPS_USER@$VPS_HOST" 'cd /opt/mathPDF && docker compose up -d --build'
