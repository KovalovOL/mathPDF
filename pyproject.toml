[project]
name = "mathpdf-formula-lab"
version = "0.1.0"
description = "PDF-grounded study content with editable mathematical text"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pdfminer-six>=20260107",
  "fonttools>=4.60,<5",
  "openai>=2,<3",
  "pypdf>=6,<7",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.22,<1",
  "pillow>=11,<14",
  "playwright>=1.58,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pypdfium2>=5,<6"]

[project.scripts]
formula-lab = "formula_lab.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formula_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
