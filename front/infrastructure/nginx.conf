worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"schema_version":1,"service":"frontend","level":"INFO","event":"http.access","timestamp":"$time_iso8601","method":"$request_method","route":"$uri","status":$status,"duration_seconds":$request_time}';
  access_log /dev/stdout json;
  sendfile on;
  client_max_body_size 30m;
  server_tokens off;
  upstream backend { server app:8765; }
  upstream administration { server admin:8765; }
  upstream reporting { server reports:8765; }

  # Private asset contract. This port is never published or routed by Traefik.
  server {
    listen 8081;
    root /usr/share/nginx/html;
    location / { try_files $uri =404; }
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    include /etc/nginx/security-headers.conf;
    proxy_set_header Host $http_host;
    proxy_set_header X-MathPDF-Original-URI "";
    proxy_redirect off;
    auth_request_set $mathpdf_access_status $upstream_http_x_mathpdf_access_status;
    auth_request_set $mathpdf_signin $upstream_http_x_mathpdf_signin;
    error_page 403 = @access_denied;
    proxy_read_timeout 180s;
    location = /health { access_log off; return 200 'ok'; }
    location ^~ /internal/ { return 404; }
    location = /_authorize {
      internal;
      proxy_pass http://backend/internal/access;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-MathPDF-Original-URI $request_uri;
    }
    location @access_denied {
      if ($mathpdf_access_status = "404") { return 404; }
      return 403;
    }
    location @signin {
      return 303 $mathpdf_signin;
    }
    location ^~ /api/admin/ { proxy_pass http://administration; }
    location = /api/reports { proxy_pass http://reporting; }
    location ^~ /api/reports/ { proxy_pass http://reporting; }
    location /api/ { proxy_pass http://backend; }
    location /auth/ { proxy_pass http://backend; }
    location = /login { proxy_pass http://backend; }
    location = / {
      auth_request /_authorize;
      error_page 401 = @signin;
      error_page 403 = @access_denied;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control no-store always;
      try_files /home.html =404;
    }
    location = /workspace {
      auth_request /_authorize;
      error_page 401 = @signin;
      error_page 403 = @access_denied;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control no-store always;
      try_files /index.html =404;
    }
    location = /admin {
      auth_request /_authorize;
      error_page 401 = @signin;
      error_page 403 = @access_denied;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control no-store always;
      try_files /admin.html =404;
    }
    location ~ ^/static/(.+\.html)/?$ {
      auth_request /_authorize;
      error_page 401 = @signin;
      error_page 403 = @access_denied;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control no-store always;
      alias /usr/share/nginx/html/$1;
    }
    location /static/ {
      alias /usr/share/nginx/html/;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control no-cache always;
    }
    location / { return 404; }
  }
}
