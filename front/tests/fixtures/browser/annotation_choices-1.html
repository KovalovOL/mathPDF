<!doctype html>
<p id="selection">Selected PDF text</p>
<button id="annotate-pdf"></button>
<div id="annotation-toolbar" hidden>
  <div id="annotation-tools"></div>
  <div id="annotation-options">
    <div id="annotation-color">
      <button data-color="#2563eb" aria-label="Blue"></button
      ><button data-color="#dc2626" aria-label="Red"></button>
    </div>
    <select id="annotation-width">
      <option>2</option></select
    ><span id="annotation-status"></span>
  </div>
</div>
<dialog id="annotation-choice">
  <form method="dialog">
    <h2 id="annotation-choice-title"></h2>
    <p id="annotation-choice-message"></p>
    <button value="cancel">Cancel</button>
    <button id="annotation-choice-discard" value="discard"></button
    ><button id="annotation-choice-save" value="save"></button>
  </form>
</dialog>
<iframe
  id="frame"
  srcdoc="<!doctype html><p>Isolated context document</p>"
></iframe>
<script type="module">
  import { createAnnotationToolbar } from "/static/annotation-toolbar.js";
  const doc = {
    id: "context-copy",
    filename: "Context - annotated.pdf",
    page_count: 1,
    original_document_id: "context-original",
  };
  const frame = document.querySelector("#frame");
  window.commands = [];
  const toolbar = createAnnotationToolbar({
    activeDocument: () => doc,
    documentFor: () => doc,
    frameFor: (id) => (id === doc.id ? frame : null),
    onSaved: () => {},
    onOpenCopy: () => {},
    onChange: () => {},
    notifyViewport: () => {},
    report: () => {},
  });
  window.state = (color = "#2563eb") =>
    dispatchEvent(
      new MessageEvent("message", {
        origin: location.origin,
        source: frame.contentWindow,
        data: {
          type: "annotation-state",
          documentId: doc.id,
          loaded: true,
          dirty: true,
          active: true,
          tool: "pen",
          color,
          width: 2,
          baseDocumentId: "context-original",
        },
      }),
    );
  window.finishSave = (error) => {
    const command = window.commands.at(-1);
    dispatchEvent(
      new MessageEvent("message", {
        origin: location.origin,
        source: frame.contentWindow,
        data: {
          type: "annotation-result",
          requestId: command.requestId,
          error,
          result: error ? null : { document: doc },
        },
      }),
    );
  };
  function ready() {
    frame.contentWindow.addEventListener("message", (event) => {
      if (event.data.action === "save") window.commands.push(event.data);
      if (event.data.action === "color") window.state(event.data.color);
    });
    window.state();
    window.ready = true;
  }
  if (frame.contentDocument.readyState === "complete") ready();
  else frame.addEventListener("load", ready, { once: true });
  window.prepare = () => {
    window.result = undefined;
    window.failure = undefined;
    toolbar
      .prepare({
        document_id: "source",
        context: [{ document_id: doc.id, page_start: 1, page_end: 1 }],
      })
      .then((value) => (window.result = value))
      .catch((error) => (window.failure = error.message));
  };
  window.hasNotes = () => toolbar.anyDirty();
</script>
