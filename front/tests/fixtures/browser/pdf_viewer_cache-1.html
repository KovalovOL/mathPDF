<!doctype html>
<style>
  body {
    margin: 0;
  }
  #pages {
    width: 100%;
  }
  .pdf-page {
    margin: 12px;
  }
  .pdf-sheet {
    position: relative;
  }
  canvas,
  .cached-page {
    position: absolute;
    width: 100%;
    height: 100%;
  }
</style>
<p id="status">Loading</p>
<div id="pages"></div>
<script type="module">
  const file = { id: "viewer-file", sha256: "original", page_count: 1 };
  window.MathPDFSession = {
    ready: Promise.resolve({ id: "viewer-owner" }),
    api: async () => file,
  };
  const { createVisualCache } = await import("/static/visual-cache.js");
  await createVisualCache("viewer-owner").put(file, "page", 1, {
    blob: new Blob(["invalid persisted image"], { type: "image/png" }),
    ratio: 4 / 3,
    baseWidth: 600,
  });
  await import("/static/pdf-viewer.js");
</script>
