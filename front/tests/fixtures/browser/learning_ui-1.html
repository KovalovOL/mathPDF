<header class="app-header"></header>
<main></main>
<div data-generation-allowance></div>
<script type="module">
  import { createReviewUI } from "/static/review-ui.js";
  import { createAllowanceUI } from "/static/allowance-ui.js";
  import { createRenameDialog } from "/static/rename-ui.js";
  const rounds = [],
    record = {
      id: "d".repeat(32),
      data: {
        mode: "flashcards",
        items: [{}, {}],
      },
      itemIndex: 0,
      flipped: false,
    };
  window.fixture = {
    record,
    rounds,
    fail: false,
    renamed: null,
  };
  let ui;
  async function api(url, options) {
    if (url === "/api/generation/allowance")
      return {
        limited: true,
        daily_tokens: 200000,
        remaining_percent: 75,
        resets_at: new Date(Date.now() + 3600000).toISOString(),
        reserved_tokens: 0,
      };
    const body = JSON.parse(options.body);
    let round = rounds.at(-1);
    if (url.endsWith("/reviews")) {
      if (!round || body.new_round) {
        round = {
          id: String(rounds.length).padStart(32, "a"),
          answers: [],
          answered_count: 0,
          correct_count: 0,
          item_count: 2,
          completed_at: null,
          history: [],
        };
        rounds.push(round);
      }
    } else {
      applyAnswer(round, body);
    }
    return structuredClone(round);
  }
  function render() {
    const main = document.querySelector("main");
    main.replaceChildren();
    const summary = ui.summary(record);
    if (summary && !record.reviewBrowse) {
      main.append(summary);
      return;
    }
    const flip = document.createElement("button");
    flip.textContent = "Flip";
    flip.onclick = () => {
      record.flipped = !record.flipped;
      render();
    };
    const controls = ui.controls(record);
    controls.update(record.flipped);
    main.append(flip, controls.root);
  }
  const options = {
    api,
    userId: "fixture",
    onChange: render,
    select: (r, i) => {
      r.itemIndex = i;
      r.flipped = false;
      render();
    },
    onError: () => {},
  };
  window.remount = () => {
    ui = createReviewUI(options);
    record.itemIndex = 0;
    record.flipped = false;
    render();
  };
  window.remount();
  await createAllowanceUI({
    api,
  }).refresh();
  const rename = document.createElement("button");
  rename.textContent = "Rename fixture";
  rename.onclick = () =>
    createRenameDialog().open({
      name: "Old title",
      kind: "study-sets",
      save: async (name) => {
        window.fixture.renamed = name;
      },
    });
  document.body.append(rename);
  function applyAnswer(round, body) {
    if (window.fixture.fail) {
      window.fixture.fail = false;
      throw new Error("Fixture connection interrupted");
    }
    if (window.fixture.conflict) {
      window.fixture.conflict = false;
      round.answers.push({
        index: body.index,
        correct: !body.correct,
      });
      round.answered_count = round.answers.length;
      const error = new Error("This card was rated on another device.");
      error.status = 409;
      throw error;
    }
    if (!round.answers.some((a) => a.index === body.index))
      round.answers.push(body);
    round.answered_count = round.answers.length;
    round.correct_count = round.answers.filter((a) => a.correct).length;
    round.incorrect_count = round.answered_count - round.correct_count;
    round.score_percent = round.correct_count * 50;
    if (round.answered_count === 2) {
      round.completed_at = "2026-10-28T00:00:00Z";
      round.history = [
        {
          id: round.id,
          completed_at: round.completed_at,
          score_percent: round.score_percent,
        },
      ];
    }
  }
</script>
